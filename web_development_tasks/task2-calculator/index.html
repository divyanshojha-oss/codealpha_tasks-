<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="calculator" aria-label="Calculator">
      <div class="heading"><div><p class="eyebrow">EVERYDAY TOOLS</p><h1>Calculator</h1></div><span class="spark">✳</span></div>
      <div class="display" aria-live="polite">
        <div class="expression" id="expression">Ready when you are</div>
        <div class="result" id="display">0</div>
      </div>
      <div class="keys">
        <button class="utility" data-action="clear">AC</button><button class="utility" data-action="delete">DEL</button><button class="operator" data-value="%">%</button><button class="operator" data-value="/">÷</button>
        <button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button><button class="operator" data-value="*">×</button>
        <button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button class="operator" data-value="-">−</button>
        <button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button class="operator" data-value="+">+</button>
        <button class="utility" data-action="sign">+/−</button><button data-value="0">0</button><button data-value=".">.</button><button class="equals" data-action="equals">=</button>
      </div>
      <p class="keyboard-note">Keyboard supported · Esc clears · Enter calculates</p>
    </section>
    <p class="footer">Simple by design. Useful by default.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
